<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ヒューマンビンゴ</title>
  <style>
    :root { --text:#172033; --muted:#64748b; --line:#dbe3ef; --primary:#3157d5; --primary2:#6d5dfc; --shadow:0 14px 38px rgba(31,41,55,.12); }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif; color:var(--text); background:linear-gradient(135deg,#eef2ff,#f8fafc 46%,#e0f2fe); }
    button { font:inherit; cursor:pointer; }
    .wrap { max-width:900px; margin:auto; padding:20px; }
    .panel { margin-top:18px; padding:clamp(16px,4vw,30px); background:rgba(255,255,255,.96); border-radius:22px; box-shadow:var(--shadow); }
    .hero { text-align:center; }
    .hero h1 { margin:0 0 7px; font-size:clamp(25px,5vw,40px); }
    .hero p { margin:0; color:var(--muted); }
    .bingo { display:grid; gap:8px; max-width:760px; margin:20px auto; }
    .cell { position:relative; min-height:104px; padding:9px; display:flex; align-items:center; justify-content:center; text-align:center; line-height:1.35; font-weight:750; color:#27324a; background:#fff; border:2px solid var(--line); border-radius:14px; transition:.18s; word-break:break-word; }
    .cell:hover { transform:translateY(-2px); border-color:#9db0dc; }
    .cell.open { color:#fff; border-color:#2563eb; background:linear-gradient(145deg,var(--primary),#7758e8); box-shadow:0 7px 18px rgba(49,87,213,.28); }
    .cell.open::after { content:"✓"; position:absolute; top:5px; right:8px; font-size:18px; font-weight:900; }
    .card-no { display:inline-block; margin-top:10px; padding:4px 12px; font-size:13px; font-weight:800; color:#3157d5; background:#eef2ff; border-radius:999px; }
    .status { min-height:25px; text-align:center; color:var(--muted); font-weight:700; }
    .actions { display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin-top:14px; }
    .btn { border:0; border-radius:12px; padding:11px 16px; font-weight:800; }
    .secondary { background:#edf2f7; color:#314158; }
    .danger { background:#fee2e2; color:#991b1b; }
    .notice { margin:14px 0; padding:12px 14px; color:#854d0e; background:#fefce8; border:1px solid #fde68a; border-radius:12px; }
    .hidden { display:none !important; }
    .celebrate { position:fixed; inset:0; z-index:30; display:flex; align-items:center; justify-content:center; padding:20px; background:rgba(17,24,39,.72); }
    .celebrate-card { width:min(520px,100%); padding:34px 28px; text-align:center; background:white; border-radius:26px; box-shadow:0 30px 70px rgba(0,0,0,.3); animation:pop .4s ease; }
    .celebrate h2 { margin:0; color:#5b4ce4; font-size:clamp(42px,11vw,74px); }
    .celebrate p { margin:8px 0 22px; font-size:22px; font-weight:900; }
    .primary { color:#fff; background:linear-gradient(135deg,var(--primary),var(--primary2)); }
    @keyframes pop { from { transform:scale(.72); opacity:0; } to { transform:scale(1); opacity:1; } }
    @media(max-width:640px) { .wrap{padding:10px}.panel{border-radius:16px}.bingo{gap:5px}.cell{min-height:82px;padding:6px;font-size:13px} }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="panel">
      <div class="hero">
        <h1 id="eventTitle"></h1>
        <p>会話して当てはまる人を見つけたら、マスをタップしてください。</p>
        <div id="cardNo" class="card-no"></div>
      </div>
      <div id="storageNotice" class="notice hidden"></div>
      <div id="bingo" class="bingo" aria-label="ビンゴカード"></div>
      <div id="status" class="status" aria-live="polite"></div>
      <div class="actions">
        <button id="reshuffle" class="btn secondary" type="button">カードを作り直す</button>
        <button id="reset" class="btn danger" type="button">穴をすべて戻す</button>
      </div>
    </section>
  </main>

  <div id="celebrate" class="celebrate hidden" role="dialog" aria-modal="true" aria-labelledby="winTitle">
    <div class="celebrate-card">
      <div style="font-size:36px">🎊✨🎉</div>
      <h2 id="winTitle">BINGO!</h2>
      <p>Congratulations!</p>
      <button id="closeCelebrate" class="btn primary" type="button">カードに戻る</button>
    </div>
  </div>

  <!-- 管理者が設定した内容。admin.htmlから出力すると、この部分が置き換わります。 -->
  <script id="bingo-config" type="application/json">{"title":"中途入社者 懇親会","size":4,"items":["北海道出身の人","関西出身の人","海外に住んだことがある人","転職が今回初めての人","入社して1か月以内の人","朝型の人","犬派の人","猫派の人","コーヒーが好きな人","甘いものが好きな人","料理が得意な人","楽器を演奏できる人","スポーツを週1回以上する人","最近旅行に行った人","同じ趣味を持つ人","同じ誕生月の人","学生時代に部活をしていた人","リモートワーク環境にこだわりがある人","おすすめの店を教えてくれた人","今日初めて話した人","資格取得に挑戦中の人","映画を月1本以上見る人","本を月1冊以上読む人","写真を撮るのが好きな人","キャンプ経験がある人","推しがいる人","辛いものが好きな人","社内でやってみたいことがある人","意外な特技がある人","今年新しいことを始めた人"]}</script>

  <script>
    (() => {
      const STATE_KEY = "humanBingoParticipantStateV2";
      const config = JSON.parse(document.querySelector("#bingo-config").textContent);
      const $ = (selector) => document.querySelector(selector);
      let selected = [];
      let opened = new Set();
      let celebratedLines = new Set();
      let cardNo = "";

      // sandboxや社内ブラウザでlocalStorageが使えない場合でも、画面自体は動かす。
      let storageAvailable = false;
      try {
        const testKey = "__human_bingo_test__";
        localStorage.setItem(testKey, "1");
        localStorage.removeItem(testKey);
        storageAvailable = true;
      } catch (error) {
        storageAvailable = false;
        $("#storageNotice").textContent = "この環境では進捗を保存できません。画面を更新するとカードが作り直されますが、ビンゴ操作は利用できます。";
        $("#storageNotice").classList.remove("hidden");
      }

      // 端末ごとに偏りなく乱数を得る（使えない環境では Math.random にフォールバック）。
      function randomInt(max) {
        if (window.crypto && crypto.getRandomValues) {
          const limit = Math.floor(0x100000000 / max) * max;
          const buf = new Uint32Array(1);
          do { crypto.getRandomValues(buf); } while (buf[0] >= limit);
          return buf[0] % max;
        }
        return Math.floor(Math.random() * max);
      }

      // カードを見分けるための番号（例: 4821）。
      function newCardNo() {
        return String(randomInt(9000) + 1000);
      }

      // 項目をランダムに並べ替える。
      function shuffle(values) {
        const result = [...values];
        for (let i = result.length - 1; i > 0; i -= 1) {
          const j = randomInt(i + 1);
          [result[i], result[j]] = [result[j], result[i]];
        }
        return result;
      }

      function signature() {
        return JSON.stringify([config.title, config.size, config.items]);
      }

      function loadSavedState() {
        if (!storageAvailable) return null;
        try { return JSON.parse(localStorage.getItem(STATE_KEY) || "null"); }
        catch (error) { return null; }
      }

      function saveState() {
        if (!storageAvailable) return;
        try {
          localStorage.setItem(STATE_KEY, JSON.stringify({ signature:signature(), cardNo, selected, opened:[...opened] }));
        } catch (error) {
          storageAvailable = false;
        }
      }

      // 同じURLでも、初回アクセス時は各ブラウザで個別にランダム生成される。
      function loadCard(forceNew = false) {
        const needed = config.size ** 2;
        const saved = loadSavedState();
        if (!forceNew && saved && saved.signature === signature() && Array.isArray(saved.selected) && saved.selected.length === needed) {
          selected = saved.selected;
          opened = new Set(saved.opened || []);
          cardNo = saved.cardNo || newCardNo();
          if (!saved.cardNo) saveState();
        } else {
          selected = shuffle(config.items).slice(0, needed);
          cardNo = newCardNo();
          opened = new Set();
          celebratedLines = new Set();
          saveState();
        }
        render();
      }

      // 現在成立しているBINGO列をID付きで返す。
      function getBingoLineIds() {
        const size = config.size;
        const lines = [];

        for (let row = 0; row < size; row += 1) {
          lines.push({ id: `row-${row}`, cells: Array.from({ length: size }, (_, col) => row * size + col) });
        }
        for (let col = 0; col < size; col += 1) {
          lines.push({ id: `col-${col}`, cells: Array.from({ length: size }, (_, row) => row * size + col) });
        }
        lines.push({ id: "diag-main", cells: Array.from({ length: size }, (_, i) => i * size + i) });
        lines.push({ id: "diag-reverse", cells: Array.from({ length: size }, (_, i) => i * size + (size - 1 - i)) });

        return lines
          .filter((line) => line.cells.every((index) => opened.has(index)))
          .map((line) => line.id);
      }

      // 参加者用ビンゴカードを描画する。
      function render() {
        const needed = config.size ** 2;
        $("#eventTitle").textContent = config.title;
        $("#cardNo").textContent = `カード No.${cardNo}`;
        $("#bingo").style.gridTemplateColumns = `repeat(${config.size}, 1fr)`;
        $("#bingo").innerHTML = "";

        selected.forEach((text, index) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = `cell${opened.has(index) ? " open" : ""}`;
          button.textContent = text;
          button.setAttribute("aria-pressed", String(opened.has(index)));
          button.addEventListener("click", () => {
            opened.has(index) ? opened.delete(index) : opened.add(index);
            saveState();
            render();
            const currentBingoLines = getBingoLineIds();
            const newBingoLines = currentBingoLines.filter((lineId) => !celebratedLines.has(lineId));
            if (newBingoLines.length > 0) {
              newBingoLines.forEach((lineId) => celebratedLines.add(lineId));
              $("#celebrate").classList.remove("hidden");
            }
          });
          $("#bingo").appendChild(button);
        });

        $("#status").textContent = `${opened.size} / ${needed} マス達成`;
      }

      $("#reshuffle").addEventListener("click", () => {
        if (confirm("カードを作り直しますか？ 開けたマスもリセットされます。")) loadCard(true);
      });

      $("#reset").addEventListener("click", () => {
        if (confirm("開けたマスをすべて戻しますか？")) {
          opened.clear();
          celebratedLines.clear();
          saveState();
          render();
        }
      });

      $("#closeCelebrate").addEventListener("click", () => $("#celebrate").classList.add("hidden"));
      $("#celebrate").addEventListener("click", (event) => {
        if (event.target === $("#celebrate")) $("#celebrate").classList.add("hidden");
      });

      loadCard(false);
    })();
  </script>
</body>
</html>
